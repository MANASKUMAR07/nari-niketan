<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Nari Niketan</title>
  <meta name="theme-color" content="#8B1A4A">
  <link rel="icon" type="image/png" href="images/icons/icon-96x96.png">
  <link rel="stylesheet" href="css/style.css?v=4.0">
  <style>
    .offline-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
      background: radial-gradient(circle at 50% 20%, rgba(139, 26, 74, 0.08) 0%, var(--cream) 70%);
    }
    .offline-card {
      background: var(--white);
      max-width: 500px;
      width: 100%;
      padding: 3rem 2rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
      animation: fadeInScale 0.5s ease-out;
    }
    .offline-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: var(--gradient-primary);
    }
    .offline-icon-wrap {
      width: 90px;
      height: 90px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(139, 26, 74, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      border: 2px dashed rgba(212, 175, 55, 0.5);
      animation: pulseOffline 2s infinite ease-in-out;
    }
    @keyframes pulseOffline {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .offline-title {
      font-family: var(--font-display);
      font-size: 1.85rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
      font-weight: 700;
    }
    .offline-desc {
      color: var(--text-light);
      font-size: 0.98rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }
    .offline-btn-retry {
      background: var(--gradient-primary);
      color: var(--white);
      border: none;
      padding: 0.85rem 1.8rem;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 4px 15px rgba(139, 26, 74, 0.3);
      transition: var(--transition);
    }
    .offline-btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 26, 74, 0.4);
    }
    .offline-links-box {
      margin-top: 1.8rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(139, 26, 74, 0.1);
    }
    .offline-links-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 0.85rem;
      font-weight: 600;
    }
    .offline-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .offline-link {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--cream);
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(212, 175, 55, 0.3);
      transition: var(--transition);
    }
    .offline-link:hover {
      background: var(--primary);
      color: var(--white);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      background: #FFF3E0;
      color: #E65100;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E65100;
    }
  </style>
  <link rel="stylesheet" href="css/nari-ai-stylist.css?v=1.2">
  <link rel="stylesheet" href="css/nari-virtual-tryon.css?v=1.0">
</head>
<body>

  <div class="offline-page-wrapper">
    <div class="offline-card">
      <div class="offline-icon-wrap">
        📡
      </div>
      <div class="status-badge">
        <span class="status-dot"></span> No Internet Connection
      </div>
      <h1 class="offline-title">You Are Currently Offline</h1>
      <p class="offline-desc">
        It looks like your internet connection is unavailable. Don't worry, you can still view pages you've visited recently or retry when back online.
      </p>

      <div class="offline-actions">
        <button class="offline-btn-retry" id="retry-btn" onclick="checkAndReload()">
          🔄 Try Reconnecting
        </button>
      </div>

      <div class="offline-links-box">
        <div class="offline-links-title">Explore Cached Sections</div>
        <div class="offline-links">
          <a href="index.html" class="offline-link">🏠 Home</a>
          <a href="shop.html" class="offline-link">🛍️ Shop</a>
          <a href="cart.html" class="offline-link">🛒 Cart</a>
          <a href="my-orders.html" class="offline-link">📦 My Orders</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    function checkAndReload() {
      const btn = document.getElementById("retry-btn");
      btn.innerHTML = "⏳ Checking Connection...";
      btn.style.opacity = "0.75";
      
      fetch("./manifest.webmanifest?t=" + Date.now(), { cache: "no-store", mode: "no-cors" })
        .then(() => {
          btn.innerHTML = "✅ Reconnected! Reloading...";
          setTimeout(() => {
            window.location.href = "./index.html";
          }, 400);
        })
        .catch(() => {
          setTimeout(() => {
            btn.innerHTML = "❌ Still Offline — Tap to Retry";
            btn.style.opacity = "1";
          }, 600);
        });
    }

    // Auto-reload as soon as internet connection is restored
    window.addEventListener("online", () => {
      const btn = document.getElementById("retry-btn");
      if (btn) btn.innerHTML = "✅ Back Online! Loading...";
      setTimeout(() => {
        window.location.reload();
      }, 500);
    });
  </script>
  <script src="js/nari-ai-stylist.js?v=1.0"></script>
  <script src="js/nari-virtual-tryon.js?v=1.0"></script>
</body>
</html>
